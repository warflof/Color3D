<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colorateur 3D</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#7c3aed;--bd:#d9d9d3;--view:#e8e8e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141417;--card:#1f1f24;--tx:#ececea;--mu:#9a9aa0;--ac:#a78bfa;--bd:#33333a;--view:#0e0e11}}
:root[data-theme="dark"]{--bg:#141417;--card:#1f1f24;--tx:#ececea;--mu:#9a9aa0;--ac:#a78bfa;--bd:#33333a;--view:#0e0e11}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:10px 14px;display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{font-size:17px;margin:0}
#view{flex:1;min-height:240px;background:var(--view);position:relative;touch-action:none;overflow:hidden}
#view canvas{display:block;width:100%;height:100%}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mu);padding:20px;pointer-events:none}
#hint.off{display:none}
#view.drag{outline:2px dashed var(--ac);outline-offset:-6px}
.panel{background:var(--card);border-top:1px solid var(--bd);padding:12px 14px;display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow-y:auto}
label.t{font-size:12px;color:var(--mu);display:block;margin-bottom:4px}
#pal{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);padding:0;cursor:pointer}
.sw.sel{outline:3px solid var(--ac);outline-offset:2px}
input[type=color]{width:34px;height:34px;border:none;background:none;padding:0}
input[type=range]{width:100%;accent-color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p,.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
#info{font-size:12px;color:var(--mu)}
#ur{position:absolute;top:10px;left:10px;display:flex;gap:8px;z-index:2}
#ur button{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--card);opacity:.6;cursor:pointer}
#ur button:hover{opacity:.95}
#ur button:disabled{opacity:.25;cursor:default}
#ur svg.r{transform:scaleX(-1)}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
</style></head>
<body>
<header><h1>Colorateur 3D</h1>
<label class="btn p">Ouvrir un fichier<input id="file" type="file" accept=".stl,.obj,.c3d" hidden></label></header>
<div id="view"><div id="ur">
<button id="bu" title="Annuler (Ctrl+Z)" aria-label="Annuler"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
<button id="br" title="Rétablir (Ctrl+Y)" aria-label="Rétablir"><svg class="r" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button></div><div id="hint">Dépose un fichier .stl ou .obj ici,<br>ou utilise le bouton en haut.</div></div>
<div class="panel">
<div><label class="t">Palette (choisis une couleur, puis touche une zone du modèle)</label>
<div id="pal"></div></div>
<div class="row seg"><button id="mz" class="on">Zone</button><button id="mb">Pinceau</button><button id="ms">Doigt</button></div>
<div id="zwrap"><label class="t">Taille de la zone : <b id="av">30</b>° <span>(180° = pièce entière)</span></label>
<input id="ang" type="range" min="5" max="180" value="30"></div>
<div id="bwrap" hidden><label class="t">Taille du pinceau : <b id="bv">8</b>%</label>
<input id="bs" type="range" min="1" max="40" value="8">
<label class="t" style="margin-top:8px"><span id="lot">Opacité du pinceau</span> : <b id="ov">100</b>%</label>
<input id="bo" type="range" min="5" max="100" value="100"></div>
<div class="row">
<button id="auto" class="p">Découpe auto</button>
<button id="all">Tout peindre</button>
<button id="undo">Annuler</button>
<button id="reset">Réinitialiser</button></div>
<div><label class="t">Enregistrer</label><div class="row"><button id="sv">Projet (.c3d)</button><button id="xp">PLY</button><button id="xg">GLB</button><button id="xi">PNG</button></div></div>
<div id="info">Glisse pour tourner, pince pour zoomer, touche pour colorer.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<script>
const $=s=>document.querySelector(s), view=$('#view');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
view.appendChild(renderer.domElement);
const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(45,1,0.01,100);
cam.position.set(2.5,2,3.5); scene.add(cam);
const ctl=new THREE.OrbitControls(cam,renderer.domElement); ctl.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x666677,0.9));
const dl=new THREE.DirectionalLight(0xffffff,0.8); dl.position.set(3,5,4); cam.add(dl);
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe(view); resize();
(function loop(){requestAnimationFrame(loop);ctl.update();renderer.render(scene,cam)})();

const COLORS=['#e63946','#f4a261','#f1c40f','#2a9d8f','#2e86de','#7c3aed','#e84393','#8d6e63','#ffffff','#9aa0a6','#3a3a3a','#111111'];
let cur=COLORS[0], mesh=null, geo=null, col=null, nb=null, fn=null, cen=null, N=0, hist=[], redo=[], mode='zone';
const pal=$('#pal');
function sel(c){cur=c;[...pal.querySelectorAll('.sw')].forEach(b=>b.classList.toggle('sel',b.dataset.c===c))}
COLORS.forEach(c=>{const b=document.createElement('button');b.className='sw';b.style.background=c;b.dataset.c=c;b.onclick=()=>sel(c);pal.appendChild(b)});
const cp=document.createElement('input');cp.type='color';cp.value='#e63946';cp.oninput=()=>sel(cp.value);pal.appendChild(cp);
sel(COLORS[0]);
$('#ang').oninput=e=>$('#av').textContent=e.target.value;

function setup(pos){
  if(mesh){scene.remove(mesh);mesh.geometry.dispose()}
  geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.computeBoundingBox(); const bb=geo.boundingBox, c=bb.getCenter(new THREE.Vector3()), s=bb.getSize(new THREE.Vector3());
  const k=2/Math.max(s.x,s.y,s.z,1e-9); origScale=1/k; geo.translate(-c.x,-c.y,-c.z); geo.scale(k,k,k);
  geo.computeVertexNormals();
  N=pos.length/9; col=new Float32Array(N*9).fill(0.7);
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.6,metalness:0.1,side:THREE.DoubleSide}));
  scene.add(mesh); hist=[]; redo=[]; refreshUR();
  buildAdj(); cam.position.set(2.5,2,3.5); ctl.target.set(0,0,0);
  $('#hint').classList.add('off'); $('#info').textContent=N.toLocaleString('fr')+' triangles. Touche le modèle pour colorer.';
}
function buildAdj(){
  const p=geo.attributes.position.array, ids=new Int32Array(N*3), m=new Map();
  for(let i=0;i<N*3;i++){const key=Math.round(p[i*3]*1e4)+','+Math.round(p[i*3+1]*1e4)+','+Math.round(p[i*3+2]*1e4);
    let v=m.get(key); if(v===undefined){v=m.size;m.set(key,v)} ids[i]=v}
  const V=m.size, e=new Map(); nb=Array.from({length:N},()=>[]);
  for(let f=0;f<N;f++)for(let j=0;j<3;j++){const a=ids[f*3+j],b=ids[f*3+(j+1)%3],key=Math.min(a,b)*V+Math.max(a,b);
    const o=e.get(key); if(o===undefined)e.set(key,f); else if(o!==f){nb[f].push(o);nb[o].push(f)}}
  const n=geo.attributes.normal.array; fn=new Float32Array(N*3);
  cen=new Float32Array(N*3);
  for(let f=0;f<N;f++){fn[f*3]=n[f*9];fn[f*3+1]=n[f*9+1];fn[f*3+2]=n[f*9+2];
    for(let k=0;k<3;k++)cen[f*3+k]=(p[f*9+k]+p[f*9+3+k]+p[f*9+6+k])/3}
}
function region(f,deg,seen){
  const th=Math.cos(deg*Math.PI/180), q=[f]; seen[f]=1;
  for(let i=0;i<q.length;i++){const a=q[i];
    for(const b of nb[a]) if(!seen[b] && fn[a*3]*fn[b*3]+fn[a*3+1]*fn[b*3+1]+fn[a*3+2]*fn[b*3+2]>=th){seen[b]=1;q.push(b)}}
  return q;
}
function paint(faces,hex,a=1){
  const c=new THREE.Color(hex); for(const f of faces)for(let j=0;j<3;j++){const i=f*9+j*3;col[i]+=(c.r-col[i])*a;col[i+1]+=(c.g-col[i+1])*a;col[i+2]+=(c.b-col[i+2])*a}
  geo.attributes.color.needsUpdate=true;
}
function snap(){hist.push(col.slice());if(hist.length>10)hist.shift();redo=[];refreshUR()}
function refreshUR(){$('#bu').disabled=!hist.length;$('#br').disabled=!redo.length}
function undo(){if(!hist.length)return;redo.push(col.slice());col.set(hist.pop());geo.attributes.color.needsUpdate=true;refreshUR()}
function redoAct(){if(!redo.length)return;hist.push(col.slice());col.set(redo.pop());geo.attributes.color.needsUpdate=true;refreshUR()}

let down=null; const ray=new THREE.Raycaster(), cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{down=(e.pointerType==='mouse'&&e.button!==0)?null:[e.clientX,e.clientY]});
cv.addEventListener('pointerup',e=>{
  if(!down||!mesh||mode==='brush'){down=null;return} const d=Math.hypot(e.clientX-down[0],e.clientY-down[1]); down=null; if(d>6)return;
  const r=cv.getBoundingClientRect();
  ray.setFromCamera({x:((e.clientX-r.left)/r.width)*2-1,y:-((e.clientY-r.top)/r.height)*2+1},cam);
  const h=ray.intersectObject(mesh)[0]; if(!h)return;
  snap(); paint(region(h.faceIndex,+$('#ang').value,new Uint8Array(N)),cur);
});
$('#auto').onclick=()=>{ if(!mesh)return; snap(); const seen=new Uint8Array(N), deg=+$('#ang').value; let k=0;
  for(let f=0;f<N;f++) if(!seen[f]) paint(region(f,deg,seen),COLORS[k++%COLORS.length]);
  $('#info').textContent=k+' parties détectées. Touche une zone pour la recolorer.'};
$('#all').onclick=()=>{ if(!mesh)return; snap(); paint(Array.from({length:N},(_,i)=>i),cur)};
$('#undo').onclick=undo; $('#bu').onclick=undo; $('#br').onclick=redoAct; refreshUR();
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.altKey){const k=e.key.toLowerCase();
  if(k==='z'&&!e.shiftKey){e.preventDefault();undo()}else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redoAct()}}});
$('#reset').onclick=()=>{ if(!mesh)return; snap(); col.fill(0.7); geo.attributes.color.needsUpdate=true};

function setMode(m){mode=m;$('#mz').classList.toggle('on',m==='zone');$('#mb').classList.toggle('on',m==='brush');$('#ms').classList.toggle('on',m==='smudge');
  $('#zwrap').hidden=m!=='zone';$('#bwrap').hidden=m==='zone';$('#lot').textContent=m==='smudge'?'Force du doigt':'Opacité du pinceau';ctl.enableRotate=true;ctl.enablePan=true;
  ctl.mouseButtons={LEFT:m==='zone'?THREE.MOUSE.ROTATE:-1,MIDDLE:THREE.MOUSE.ROTATE,RIGHT:THREE.MOUSE.PAN};
  ctl.touches={ONE:m==='zone'?THREE.TOUCH.ROTATE:-1,TWO:THREE.TOUCH.DOLLY_PAN}}
$('#mz').onclick=()=>setMode('zone'); $('#mb').onclick=()=>setMode('brush'); $('#ms').onclick=()=>setMode('smudge');
cv.addEventListener('mousedown',e=>{if(e.button===1)e.preventDefault()});
setMode('zone');
$('#bs').oninput=e=>$('#bv').textContent=e.target.value;
$('#bo').oninput=e=>$('#ov').textContent=e.target.value;
function dab(e){
  const r=cv.getBoundingClientRect();
  ray.setFromCamera({x:((e.clientX-r.left)/r.width)*2-1,y:-((e.clientY-r.top)/r.height)*2+1},cam);
  const h=ray.intersectObject(mesh)[0]; if(!h)return;
  const rad=+$('#bs').value/100, p=h.point, q=[h.faceIndex], seen=new Set(q);
  for(let i=0;i<q.length;i++)for(const b of nb[q[i]]) if(!seen.has(b)){seen.add(b);
    const dx=cen[b*3]-p.x,dy=cen[b*3+1]-p.y,dz=cen[b*3+2]-p.z; if(dx*dx+dy*dy+dz*dz<=rad*rad)q.push(b)}
  if(mode==='smudge'){if(!first&&lastP&&p.distanceTo(lastP)<rad*0.3)return; lastP=p.clone(); smudge(q,first);first=false;return}
  const fresh=q.filter(f=>!stroke.has(f)); fresh.forEach(f=>stroke.add(f)); paint(fresh,cur,+$('#bo').value/100);
}
let first=false, carried=null, lastP=null;
function smudge(q,first){
  const orig=hist[hist.length-1]||col; let r=0,g=0,b=0; for(const f of q){r+=orig[f*9];g+=orig[f*9+1];b+=orig[f*9+2]}
  const n=q.length; r/=n;g/=n;b/=n;
  if(first||!carried){carried=[r,g,b];return}
  const a=+$('#bo').value/100*0.5;
  for(const f of q)for(let j=0;j<3;j++){const i=f*9+j*3;for(let k=0;k<3;k++)col[i+k]+=(carried[k]-col[i+k])*a}
  geo.attributes.color.needsUpdate=true;
  carried=[carried[0]+(r-carried[0])*0.15,carried[1]+(g-carried[1])*0.15,carried[2]+(b-carried[2])*0.15];
}
let bru=false; const ptrs=new Set(), stroke=new Set();
cv.addEventListener('pointerdown',e=>{ptrs.add(e.pointerId); if(e.pointerType==='mouse'&&e.button!==0){bru=false;return} if(mode==='zone'||!mesh)return;
  if(ptrs.size>1){bru=false;return} snap(); stroke.clear(); first=true; bru=true; dab(e)});
cv.addEventListener('pointermove',e=>{if(bru&&mode!=='zone'&&ptrs.size===1)dab(e)});
['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,e=>{ptrs.delete(e.pointerId);bru=false}));
let modelName='modele', origScale=1;
function b64(arr){const u=new Uint8Array(arr.buffer,arr.byteOffset,arr.byteLength);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
function unb64(s){const t=atob(s),u=new Uint8Array(t.length);for(let i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u}
function saveBlob(blob,fn){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function need(){if(!mesh){$('#info').textContent="Charge d'abord un modèle.";return false}return true}
$('#sv').onclick=()=>{if(!need())return;
  const d={v:1,name:modelName,scale:origScale,pos:b64(geo.attributes.position.array),col:b64(Uint8Array.from(col,v=>Math.round(v*255)))};
  saveBlob(new Blob([JSON.stringify(d)],{type:'application/json'}),modelName+'.c3d'); $('#info').textContent='Projet enregistré : '+modelName+'.c3d'};
$('#xp').onclick=()=>{if(!need())return;
  const p=geo.attributes.position.array, V=N*3, s=origScale;
  const head='ply\nformat binary_little_endian 1.0\nelement vertex '+V+'\nproperty float x\nproperty float y\nproperty float z\nproperty uchar red\nproperty uchar green\nproperty uchar blue\nelement face '+N+'\nproperty list uchar int vertex_indices\nend_header\n';
  const h=new TextEncoder().encode(head), buf=new ArrayBuffer(h.length+V*15+N*13), dv=new DataView(buf); new Uint8Array(buf).set(h); let o=h.length;
  for(let i=0;i<V;i++){dv.setFloat32(o,p[i*3]*s,true);dv.setFloat32(o+4,p[i*3+1]*s,true);dv.setFloat32(o+8,p[i*3+2]*s,true);
    dv.setUint8(o+12,Math.round(col[i*3]*255));dv.setUint8(o+13,Math.round(col[i*3+1]*255));dv.setUint8(o+14,Math.round(col[i*3+2]*255));o+=15}
  for(let f=0;f<N;f++){dv.setUint8(o,3);dv.setInt32(o+1,f*3,true);dv.setInt32(o+5,f*3+1,true);dv.setInt32(o+9,f*3+2,true);o+=13}
  saveBlob(new Blob([buf],{type:'application/octet-stream'}),modelName+'.ply'); $('#info').textContent='Export PLY terminé.'};
$('#xg').onclick=()=>{if(!need())return;
  if(!THREE.GLTFExporter){$('#info').textContent='Export GLB indisponible (script non chargé).';return}
  const m=mesh.clone(); m.scale.setScalar(origScale);
  new THREE.GLTFExporter().parse(m,r=>{saveBlob(new Blob([r],{type:'model/gltf-binary'}),modelName+'.glb'); $('#info').textContent='Export GLB terminé.'},{binary:true})};
$('#xi').onclick=()=>{if(!need())return; renderer.render(scene,cam); cv.toBlob(b=>{saveBlob(b,modelName+'.png'); $('#info').textContent='Capture PNG enregistrée.'})};
async function loadFile(f){
  if(!f)return; const n=f.name.toLowerCase();
  try{
    const buf=await f.arrayBuffer(); modelName=f.name.replace(/\.[^.]+$/,'');
    if(n.endsWith('.c3d')){
      const d=JSON.parse(new TextDecoder().decode(buf)); setup(new Float32Array(unb64(d.pos).buffer));
      const u=unb64(d.col); if(u.length===col.length)for(let i=0;i<u.length;i++)col[i]=u[i]/255;
      geo.attributes.color.needsUpdate=true; if(d.scale)origScale=d.scale; if(d.name)modelName=d.name;
      $('#info').textContent='Projet chargé : '+N.toLocaleString('fr')+' triangles.';
    } else if(n.endsWith('.stl')){ const g=new THREE.STLLoader().parse(buf); setup(Float32Array.from(g.attributes.position.array)); }
    else if(n.endsWith('.obj')){
      const obj=new THREE.OBJLoader().parse(new TextDecoder().decode(buf)), parts=[]; obj.updateMatrixWorld(true);
      obj.traverse(m=>{if(m.isMesh){let g=m.geometry.clone();if(g.index)g=g.toNonIndexed();g.applyMatrix4(m.matrixWorld);parts.push(g.attributes.position.array)}});
      const len=parts.reduce((s,a)=>s+a.length,0), pos=new Float32Array(len); let o=0; parts.forEach(a=>{pos.set(a,o);o+=a.length});
      if(!len)throw 0; setup(pos);
    } else throw 0;
  }catch(err){$('#info').textContent='Fichier illisible. Formats acceptés : .stl, .obj ou .c3d.'}
}
$('#file').onchange=e=>loadFile(e.target.files[0]);
['dragover','dragenter'].forEach(t=>view.addEventListener(t,e=>{e.preventDefault();view.classList.add('drag')}));
['dragleave','drop'].forEach(t=>view.addEventListener(t,e=>{e.preventDefault();view.classList.remove('drag')}));
view.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
</script></body></html>
